<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VR-Class · 虚拟教室</title>
<!-- 公式/图示渲染（联网时加载；离线则自动降级为源码展示） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0b0e1a; --bg2:#11152a; --panel:#161b33; --panel2:#1c2340;
    --board:#0a1622; --board-edge:#22304a;
    --ink:#eaf0ff; --muted:#9aa6c4; --faint:#5c688a;
    --teal:#36d6c3; --amber:#f7b955; --indigo:#8a9bff; --pink:#ff7ea8;
    --hl:rgba(247,185,85,.22); --hl-line:#f7b955;
    --radius:16px; --shadow:0 18px 50px rgba(0,0,0,.45);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -10%, #1a2348 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 110%, #1a1230 0%, transparent 55%),
      var(--bg);
    overflow:hidden;
  }
  .app{height:100vh; display:flex; flex-direction:column; max-width:1240px; margin:0 auto; padding:0 16px}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex; align-items:center; gap:14px; padding:14px 6px 10px}
  .logo{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.5px}
  .logo .dot{width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,var(--teal),var(--indigo)); box-shadow:0 0 18px rgba(54,214,195,.5)}
  .logo small{font-weight:500; color:var(--muted); margin-left:2px}
  .topbar .spacer{flex:1}
  .lesson-title{font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px}
  .lesson-title b{color:var(--ink)}
  .top-btn{background:var(--panel); border:1px solid #2a335a; color:var(--muted); padding:7px 12px;
    border-radius:10px; font-size:13px; cursor:pointer}
  .top-btn:hover{color:var(--ink); border-color:#3a4684}
  .mode-badge{font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid #2a4570; color:var(--teal); background:rgba(54,214,195,.08); white-space:nowrap}
  .mode-badge.warn{border-color:#5a2c3a; color:var(--pink); background:rgba(255,126,168,.08)}

  /* ============================================================= */
  /*  入口 / 点题页                                                 */
  /* ============================================================= */
  #entry{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px}
  #entry .kicker{color:var(--teal); font-weight:600; letter-spacing:3px; font-size:13px}
  #entry h1{font-size:40px; margin:8px 0 4px; line-height:1.2}
  #entry h1 .grad{background:linear-gradient(120deg,var(--teal),var(--indigo) 60%,var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  #entry p.sub{color:var(--muted); font-size:16px; margin:0 0 26px}
  .ask{width:min(640px,92vw); background:var(--panel); border:1px solid #2c3768; border-radius:18px;
    padding:10px 10px 10px 18px; display:flex; gap:10px; align-items:center; box-shadow:var(--shadow)}
  .ask input{flex:1; background:transparent; border:0; outline:0; color:var(--ink); font-size:17px}
  .ask input::placeholder{color:#6b769b}
  .go{background:linear-gradient(135deg,var(--teal),var(--indigo)); color:#06121f; font-weight:700;
    border:0; border-radius:12px; padding:12px 20px; font-size:15px; cursor:pointer; white-space:nowrap}
  .go:hover{filter:brightness(1.07)}
  .go:disabled{opacity:.6; cursor:default}
  .chips{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px; width:min(720px,92vw)}
  .chip{background:var(--panel); border:1px solid #2a335a; color:var(--muted); padding:8px 14px;
    border-radius:999px; font-size:13.5px; cursor:pointer; transition:.18s}
  .chip:hover{color:var(--ink); border-color:var(--teal); transform:translateY(-1px)}
  .chip .tag{color:var(--teal); font-size:11px; margin-right:6px}
  .entry-note{margin-top:20px; font-size:12.5px; color:var(--faint); max-width:560px; line-height:1.7}
  .entry-note code{color:var(--teal); background:#10172e; padding:1px 6px; border-radius:5px; font-size:12px}

  /* ============================================================= */
  /*  授课页                                                        */
  /* ============================================================= */
  #lesson{flex:1; display:none; grid-template-columns:210px 1fr; gap:16px; padding-bottom:14px; min-height:0}
  #lesson.on{display:grid}

  /* 章节导航 */
  .rail{background:linear-gradient(180deg,var(--panel),var(--bg2)); border:1px solid #232a4d;
    border-radius:var(--radius); padding:16px 14px; overflow:auto}
  .rail h4{margin:2px 0 14px; font-size:12px; letter-spacing:2px; color:var(--muted); font-weight:600}
  .step{display:flex; gap:10px; align-items:flex-start; padding:9px 8px; border-radius:10px; cursor:pointer;
    color:var(--muted); font-size:13.5px; transition:.18s}
  .step:hover{background:#1b2240}
  .step .ix{width:22px;height:22px;border-radius:50%; border:1.5px solid #38426f; flex:none;
    display:grid; place-items:center; font-size:11px; color:var(--muted)}
  .step.done .ix{background:#243056; border-color:#3a4684; color:var(--teal)}
  .step.active{background:linear-gradient(90deg,rgba(54,214,195,.14),transparent); color:var(--ink); font-weight:600}
  .step.active .ix{border-color:var(--teal); color:#06121f; background:var(--teal); box-shadow:0 0 12px rgba(54,214,195,.6)}

  /* 舞台 */
  .stage{position:relative; display:flex; flex-direction:column; min-height:0}

  /* 智能板书 */
  .board-wrap{flex:1; position:relative; min-height:0}
  .board{position:absolute; inset:0; background:
      radial-gradient(120% 100% at 50% 0%, #102134 0%, var(--board) 55%, #070f18 100%);
    border:1px solid var(--board-edge); border-radius:20px; box-shadow:var(--shadow), inset 0 0 60px rgba(0,0,0,.5);
    overflow:hidden}
  .board::before{content:""; position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);
    background-size:34px 34px; mask:radial-gradient(120% 90% at 50% 40%,#000 55%,transparent 100%)}
  .board-pad{position:absolute; inset:0; padding:34px 40px; display:flex; flex-direction:column; justify-content:center; overflow:auto}
  .chapter-tag{position:absolute; top:16px; left:22px; font-size:12px; letter-spacing:2px;
    color:var(--teal); border:1px solid #1e6b62; background:rgba(54,214,195,.08); padding:4px 10px; border-radius:999px}
  .scene-counter{position:absolute; top:16px; right:22px; font-size:12px; color:var(--faint)}

  /* 板书内容通用：逐步呈现 */
  .reveal{opacity:0; transform:translateY(14px); animation:reveal .5s var(--ease) forwards}
  @keyframes reveal{to{opacity:1; transform:none}}

  .b-title{font-size:28px; font-weight:750; margin:0 0 18px; line-height:1.25}
  .b-title .u{background:linear-gradient(transparent 62%, var(--hl) 62%)}
  .b-points{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:13px}
  .b-points li{display:flex; gap:12px; font-size:19px; color:#dde6ff; align-items:flex-start}
  .b-points li .bullet{color:var(--teal); font-size:20px; line-height:1.2}
  .b-points li b{color:var(--amber)}
  .b-para{font-size:19px; line-height:1.7; color:#dde6ff; margin:0 0 12px; max-width:840px}
  .b-para b{color:var(--amber)}
  .hl-term{color:var(--amber); font-weight:700}

  /* 公式（KaTeX，离线降级为源码） */
  .formula-box{display:flex; flex-direction:column; align-items:flex-start; gap:6px}
  .formula-katex{font-size:30px; color:#eef3ff; line-height:1.5; max-width:100%; overflow-x:auto}
  .formula-fallback{font-size:22px; font-family:"JetBrains Mono",Consolas,monospace; color:#cdd6f4;
    background:#0b1020; padding:14px 18px; border-radius:10px; border:1px solid #1d2a44; white-space:pre-wrap}

  /* 图示（Mermaid，离线降级为源码） */
  .mmd{display:flex; justify-content:center; align-items:center; min-height:180px}
  .mmd svg{max-width:100%; max-height:46vh; height:auto}
  .mmd-fallback{width:100%; font-family:"JetBrains Mono",Consolas,monospace; color:#cdd6f4;
    background:#0b1020; padding:16px 18px; border-radius:10px; border:1px solid #1d2a44; white-space:pre-wrap; font-size:14px}

  /* 代码 */
  .code{background:#070d16; border:1px solid #1d2a44; border-radius:12px; padding:18px 20px; font-size:15px;
    font-family:"JetBrains Mono",Consolas,Menlo,monospace; line-height:1.7; color:#cdd6f4; overflow:auto; max-width:100%}
  .code .ln{display:block; white-space:pre}
  .code .c{color:#6b7a99}

  /* 热力图 / 矩阵 */
  .heat-wrap{display:flex; gap:30px; align-items:center; flex-wrap:wrap}
  .heat{display:inline-grid; gap:6px; align-items:center}
  .heat .h-lbl{font-size:14px; color:var(--muted); text-align:right; padding-right:6px}
  .heat .h-col{font-size:13px; color:var(--muted); text-align:center}
  .cell{height:46px; min-width:46px; border-radius:8px; display:grid; place-items:center; font-size:12px; color:#04121b; font-weight:700; background:var(--teal)}
  .heat-note{max-width:320px; color:var(--muted); font-size:15px; line-height:1.7}
  .heat-note b{color:var(--amber)}

  /* 小测 quiz */
  .quiz{max-width:780px; width:100%}
  .quiz .q{font-size:22px; font-weight:700; margin:0 0 18px; line-height:1.4}
  .quiz .opt{display:flex; gap:12px; align-items:center; padding:12px 16px; margin-bottom:10px; border:1px solid #2a335a;
    border-radius:12px; cursor:pointer; font-size:17px; color:#dde6ff; transition:.15s; background:#0d1426}
  .quiz .opt:hover{border-color:var(--teal)}
  .quiz .opt .k{width:24px;height:24px;border-radius:6px; background:#1a2444; color:var(--muted); display:grid; place-items:center; font-size:13px; font-weight:700; flex:none}
  .quiz .opt.correct{border-color:var(--teal); background:rgba(54,214,195,.12)}
  .quiz .opt.correct .k{background:var(--teal); color:#06121f}
  .quiz .opt.wrong{border-color:var(--pink); background:rgba(255,126,168,.1)}
  .quiz .explain{margin-top:14px; font-size:15px; color:var(--muted); line-height:1.7; min-height:22px}
  .quiz .explain b{color:var(--amber)}

  /* 占位（image / chart / animation） */
  .ph{border:1px dashed #2c3768; border-radius:14px; padding:30px; text-align:center; color:var(--muted); background:#0d1426; max-width:560px}
  .ph .ic{font-size:34px; margin-bottom:8px}
  .ph .pp{margin-top:8px; font-size:13px; color:var(--faint)}
  .ph img{max-width:100%; max-height:44vh; border-radius:10px}

  /* 备课中 */
  .loading{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; color:var(--ink); z-index:8; background:radial-gradient(120% 100% at 50% 0%, #102134 0%, var(--board) 60%, #070f18 100%)}
  .loading.hidden{display:none}
  .loading .spin{width:46px;height:46px;border-radius:50%; border:3px solid #243056; border-top-color:var(--teal); animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading .main{font-size:18px; font-weight:600}
  .loading .tip{font-size:13px; color:var(--faint)}

  /* ---------- 老师立绘 ---------- */
  .tutor{position:absolute; left:10px; bottom:10px; display:flex; align-items:flex-end; gap:12px; z-index:5}
  .avatar{position:relative; width:96px; height:96px; flex:none}
  .avatar svg{width:100%; height:100%; filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
  .avatar .ring{position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--teal); opacity:0}
  .tutor.speaking .avatar .ring{animation:ping 1.6s var(--ease) infinite}
  @keyframes ping{0%{opacity:.7; transform:scale(.92)}70%{opacity:0; transform:scale(1.18)}100%{opacity:0}}
  .bubble{background:var(--panel2); border:1px solid #2c3768; border-radius:14px 14px 14px 4px; padding:9px 14px;
    max-width:230px; font-size:13px; color:var(--muted); margin-bottom:14px; opacity:0; transition:.3s}
  .tutor.speaking .bubble{opacity:1}
  .tutor .name{position:absolute; left:0; bottom:-2px; font-size:11px; color:var(--faint); width:96px; text-align:center}

  /* ---------- 字幕条 ---------- */
  .subtitle{margin-top:14px; background:linear-gradient(90deg,rgba(20,26,52,.9),rgba(16,20,40,.65));
    border:1px solid #232a4d; border-radius:14px; padding:14px 18px; min-height:58px; display:flex; align-items:center; gap:12px}
  .subtitle .mic{color:var(--teal); font-size:18px; flex:none}
  .subtitle p{margin:0; font-size:16.5px; line-height:1.55; color:#e8eeff}

  /* ---------- 控制条 ---------- */
  .controls{margin-top:12px; display:flex; align-items:center; gap:10px}
  .ctrl{background:var(--panel); border:1px solid #2a335a; color:var(--ink); width:42px; height:42px; border-radius:12px;
    display:grid; place-items:center; cursor:pointer; font-size:16px; transition:.15s}
  .ctrl:hover{border-color:var(--teal); color:var(--teal)}
  .ctrl.primary{background:linear-gradient(135deg,var(--teal),var(--indigo)); color:#06121f; border:0; width:46px;height:46px; font-size:18px}
  .progress{flex:1; height:8px; background:#1a2140; border-radius:999px; overflow:hidden; margin:0 8px}
  .progress .bar{height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--indigo)); transition:width .4s var(--ease)}
  .ask-btn{background:#172742; border:1px solid #2a4570; color:var(--teal); padding:0 16px; height:42px;
    border-radius:12px; cursor:pointer; font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px}
  .ask-btn:hover{background:#1d3253}

  /* ---------- 提问浮层 ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(5,8,18,.66); backdrop-filter:blur(4px); display:none;
    align-items:center; justify-content:center; z-index:50}
  .modal-bg.on{display:flex}
  .modal{width:min(560px,92vw); background:linear-gradient(180deg,var(--panel),var(--bg2)); border:1px solid #2c3768;
    border-radius:18px; padding:22px; box-shadow:var(--shadow)}
  .modal h3{margin:0 0 4px; font-size:18px}
  .modal .qline{display:flex; gap:8px; margin:16px 0}
  .modal .qline input{flex:1; background:#0d1226; border:1px solid #2a335a; border-radius:10px; color:var(--ink);
    padding:11px 14px; outline:0; font-size:15px}
  .ans{background:#0d1a2b; border:1px solid #1f3350; border-radius:12px; padding:14px 16px; margin-top:6px;
    font-size:15px; line-height:1.7; color:#dde6ff}
  .ans .who{color:var(--teal); font-weight:600; font-size:13px; margin-bottom:6px; display:flex; gap:7px; align-items:center}
  .modal .foot{display:flex; justify-content:flex-end; gap:10px; margin-top:18px}
  .ghost{background:transparent; border:1px solid #2a335a; color:var(--muted); padding:9px 16px; border-radius:10px; cursor:pointer}
  .ghost:hover{color:var(--ink)}

  .hint{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--faint);
    background:#0d1226; border:1px solid #232a4d; padding:6px 14px; border-radius:999px; z-index:40}
  .toast{position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#10172e; border:1px solid #2a4570;
    color:var(--ink); padding:10px 16px; border-radius:12px; font-size:13px; z-index:60; box-shadow:var(--shadow); max-width:80vw}
  @media(max-width:780px){
    #lesson{grid-template-columns:1fr} .rail{display:none}
    #entry h1{font-size:30px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo"><span class="dot"></span>VR-Class <small>沉浸式 AI 模拟课堂</small></div>
    <div class="spacer"></div>
    <div class="lesson-title" id="topTitle"></div>
    <button class="top-btn" onclick="resetApp()">↻ 重新点题</button>
  </div>

  <!-- ====== 入口 / 点题 ====== -->
  <section id="entry">
    <div class="kicker">VIRTUAL CLASSROOM</div>
    <h1>今天想学点 <span class="grad">什么</span>？</h1>
    <p class="sub">说出一个主题，AI 老师就在虚拟教室里，现场为你设计并一笔一画讲出来。</p>
    <div class="ask">
      <input id="topicInput" placeholder="例如：Transformer 的注意力机制是怎么算的？" onkeydown="if(event.key==='Enter')startLesson()" />
      <button class="go" id="goBtn" onclick="startLesson()">开始上课 ▶</button>
    </div>
    <div class="chips">
      <div class="chip" onclick="fillTopic('Transformer 的注意力机制')"><span class="tag">AI前沿</span>注意力机制怎么算</div>
      <div class="chip" onclick="fillTopic('微积分里的极限到底在说什么')"><span class="tag">数理</span>微积分的极限</div>
      <div class="chip" onclick="fillTopic('用大白话讲清楚什么是区块链')"><span class="tag">概念</span>什么是区块链</div>
      <div class="chip" onclick="fillTopic('光合作用')"><span class="tag">理科</span>光合作用</div>
    </div>
    <div class="entry-note" id="entryNote"></div>
  </section>

  <!-- ====== 授课页 ====== -->
  <section id="lesson">
    <!-- 章节导航 -->
    <aside class="rail">
      <h4>今天的课</h4>
      <div id="railList"></div>
    </aside>

    <!-- 舞台 -->
    <div class="stage">
      <div class="board-wrap">
        <div class="board">
          <div class="chapter-tag" id="chapterTag"></div>
          <div class="scene-counter" id="sceneCounter"></div>
          <div class="board-pad" id="boardPad"></div>

          <!-- 备课中 -->
          <div class="loading hidden" id="loading">
            <div class="spin"></div>
            <div class="main" id="loadingMain">老师正在备课…</div>
            <div class="tip" id="loadingTip">为你现场设计这堂课的章节与板书</div>
          </div>

          <!-- 老师立绘 -->
          <div class="tutor speaking" id="tutor">
            <div class="avatar">
              <div class="ring"></div>
              <svg viewBox="0 0 120 120">
                <defs>
                  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#8a9bff"/><stop offset="1" stop-color="#36d6c3"/>
                  </linearGradient>
                </defs>
                <circle cx="60" cy="60" r="58" fill="#141a33"/>
                <path d="M18 108 Q60 74 102 108 Z" fill="url(#g1)"/>
                <path d="M30 104 Q60 84 90 104 L86 116 L34 116 Z" fill="#26305a"/>
                <circle cx="60" cy="50" r="24" fill="#f3c9a4"/>
                <path d="M36 46 Q40 24 60 24 Q80 24 84 46 Q80 36 60 36 Q40 36 36 46Z" fill="#3a2f4d"/>
                <rect x="44" y="47" width="13" height="10" rx="3" fill="none" stroke="#1c2440" stroke-width="2"/>
                <rect x="63" y="47" width="13" height="10" rx="3" fill="none" stroke="#1c2440" stroke-width="2"/>
                <line x1="57" y1="51" x2="63" y2="51" stroke="#1c2440" stroke-width="2"/>
                <circle cx="50.5" cy="52" r="1.8" fill="#1c2440"/><circle cx="69.5" cy="52" r="1.8" fill="#1c2440"/>
                <path d="M54 62 Q60 66 66 62" fill="none" stroke="#b56a4d" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="name">林老师</div>
            <div class="bubble" id="tutorBubble">在听，随时可以打断我提问 🙋</div>
          </div>
        </div>
      </div>

      <!-- 字幕 -->
      <div class="subtitle"><span class="mic">🔊</span><p id="subtitle">…</p></div>

      <!-- 控制 -->
      <div class="controls">
        <div class="ctrl" title="上一步" onclick="prevScene()">◀</div>
        <div class="ctrl primary" id="playBtn" title="自动播放/暂停" onclick="togglePlay()">⏸</div>
        <div class="ctrl" title="下一步" onclick="nextScene()">▶</div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
        <button class="ask-btn" onclick="openAsk()">💬 提问</button>
      </div>
    </div>
  </section>
</div>

<!-- 提问浮层 -->
<div class="modal-bg" id="askModal">
  <div class="modal">
    <h3>举手提问</h3>
    <div style="color:var(--muted);font-size:13px">老师会结合你当前学到的内容回答，答完回到课堂。</div>
    <div class="qline">
      <input id="askInput" placeholder="对刚才那一步有疑问？问问看…" onkeydown="if(event.key==='Enter')answerAsk()" />
      <button class="go" style="padding:11px 16px" onclick="answerAsk()">问</button>
    </div>
    <div class="ans">
      <div class="who">🎓 林老师</div>
      <div id="askAnswer">输入一个问题，我来解答。</div>
    </div>
    <div class="foot"><button class="ghost" onclick="closeAsk()">回到课堂 ▶</button></div>
  </div>
</div>

<div class="hint">点题 → AI 现场生成这堂课 → 播放　·　用 ◀ ▶ 或空格控制，点「提问」追问</div>

<script>
/* =========================================================================
   VR-Class 前端：通用「演示脚本播放器」
   - 不再内置某一课，而是把后端返回的 Lesson Script（PRD §5.3）渲染并播放。
   - 渲染由 visual.type 驱动；新增视觉类型 = 加一个 renderer。
   - 后端不可达时，回退到下方 BUILTIN_LESSON（离线示例）。
   ========================================================================= */

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(html){const d=document.createElement("div"); d.className="reveal"; d.innerHTML=html; return d;}
function setBoard(node){const pad=document.getElementById("boardPad"); pad.innerHTML=""; pad.appendChild(node);}
function inlineFmt(s, highlight){
  let h = esc(s);
  h = h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');               // **加粗** → amber
  (highlight||[]).forEach(term=>{ if(!term) return; const t=esc(String(term));
    h = h.split(t).join(`<span class="hl-term">${t}</span>`); }); // 高亮关键词
  return h;
}

/* ---------- 板书渲染器（按 visual.type 分派）---------- */
function renderVisual(v, highlight){
  if(!v || !v.type) return el('<div class="b-para">（空场景）</div>');
  switch(v.type){
    case 'text':    return renderText(v.content, highlight);
    case 'formula': return renderFormula(v.latex || v.content || '');
    case 'diagram': return renderDiagram(v.content || '', v.format);
    case 'code':    return renderCode(v.content || '', v.language);
    case 'heatmap': return renderHeatmap(v);
    case 'quiz':    return renderQuiz(v);
    case 'image':   return renderImage(v);
    default:        return renderPlaceholder(v);
  }
}
function renderText(content, highlight){
  const lines = String(content||'').split('\n'); let html=''; let i=0;
  while(i<lines.length){
    const ln = lines[i];
    if(/^\s*##\s+/.test(ln)){ html += `<h2 class="b-title"><span class="u">${inlineFmt(ln.replace(/^\s*##\s+/,''),highlight)}</span></h2>`; i++; continue; }
    if(/^\s*[-*]\s+/.test(ln)){
      const items=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,'')); i++; }
      html += `<ul class="b-points">`+items.map((t,k)=>`<li class="reveal" style="animation-delay:${(.1+k*.16).toFixed(2)}s"><span class="bullet">▸</span><span>${inlineFmt(t,highlight)}</span></li>`).join('')+`</ul>`;
      continue;
    }
    if(ln.trim()===''){ i++; continue; }
    html += `<div class="b-para">${inlineFmt(ln,highlight)}</div>`; i++;
  }
  return el(html || '<div class="b-para"></div>');
}
function renderFormula(latex){
  const box = el('<div class="formula-box"></div>');
  if(window.katex){
    const span=document.createElement('div'); span.className='formula-katex';
    try{ katex.render(latex, span, {displayMode:true, throwOnError:false}); box.appendChild(span); }
    catch(e){ box.innerHTML = `<div class="formula-fallback">${esc(latex)}</div>`; }
  } else { box.innerHTML = `<div class="formula-fallback">${esc(latex)}</div>`; }
  return box;
}
let _mmid=0;
function renderDiagram(content, format){
  const box = el('<div class="mmd">图示渲染中…</div>');
  if(window.mermaid){
    const id='mmd'+(++_mmid);
    try{
      Promise.resolve(mermaid.render(id, content))
        .then(r=>{ box.innerHTML = (r && r.svg) ? r.svg : `<div class="mmd-fallback">${esc(content)}</div>`; })
        .catch(()=>{ box.innerHTML=`<div class="mmd-fallback">${esc(content)}</div>`; });
    }catch(e){ box.innerHTML=`<div class="mmd-fallback">${esc(content)}</div>`; }
  } else { box.innerHTML=`<div class="mmd-fallback">${esc(content)}</div>`; }
  return box;
}
function renderCode(content, language){
  const lines = esc(content).split('\n').map(line => line.replace(/(#.*)$/, '<span class="c">$1</span>'));
  return el(`<div class="code">${lines.map(l=>`<span class="ln">${l}</span>`).join('')}</div>`);
}
function renderHeatmap(v){
  const rows=v.rows||[], cols=v.cols||[], W=v.weights||[];
  const grid=`grid-template-columns:auto repeat(${cols.length},46px)`;
  let cells=`<div class="h-lbl"></div>`+cols.map(c=>`<div class="h-col">${esc(c)}</div>`).join('');
  rows.forEach((r,i)=>{ cells+=`<div class="h-lbl">${esc(r)}</div>`+(W[i]||[]).map(x=>{
    const val=Math.max(0,Math.min(1,Number(x)||0));
    return `<div class="cell" style="background:rgba(54,214,195,${(.12+val).toFixed(2)})">${val.toFixed(2)}</div>`;
  }).join(''); });
  return el(`<h2 class="b-title" style="font-size:22px">权重热力图</h2>
    <div class="heat-wrap"><div class="heat" style="${grid}">${cells}</div>
    ${v.annotate?`<div class="heat-note">${inlineFmt(v.annotate)}</div>`:''}</div>`);
}
function renderQuiz(v){
  const node = el(`<div class="quiz"><div class="q">${inlineFmt(v.question)}</div>
    <div class="opts">${(v.options||[]).map((o,k)=>`<div class="opt" data-k="${k}"><span class="k">${'ABCD'[k]||k+1}</span><span>${inlineFmt(o)}</span></div>`).join('')}</div>
    <div class="explain"></div></div>`);
  const ans = (typeof v.answer==='number')?v.answer:-1;
  const exp = node.querySelector('.explain');
  node.querySelectorAll('.opt').forEach(opt=>{
    opt.onclick=()=>{
      node.querySelectorAll('.opt').forEach(o=>o.style.pointerEvents='none');
      const k=+opt.dataset.k;
      if(k===ans){ opt.classList.add('correct'); exp.innerHTML=`<b>答对了！</b> ${inlineFmt(v.explain_correct)}`; }
      else{ opt.classList.add('wrong'); const right=node.querySelector(`.opt[data-k="${ans}"]`); if(right)right.classList.add('correct');
        exp.innerHTML=`正确答案是 <b>${'ABCD'[ans]||ans+1}</b>。${inlineFmt(v.explain_wrong||v.explain_correct||'')}`; }
    };
  });
  return node;
}
function renderImage(v){
  if(v.url) return el(`<div class="ph"><img src="${esc(v.url)}" alt=""/></div>`);
  return el(`<div class="ph"><div class="ic">🖼️</div><div>配图占位</div><div class="pp">${esc(v.prompt||'')}</div></div>`);
}
function renderPlaceholder(v){
  return el(`<div class="ph"><div class="ic">✨</div><div>「${esc(v.type)}」视觉（产品版支持）</div><div class="pp">${esc(JSON.stringify(v).slice(0,140))}</div></div>`);
}

/* ---------- 把 Lesson Script 装载进播放器 ---------- */
const LESSON = { title:'', chapters:[], scenes:[] };
function loadLesson(lesson){
  LESSON.title = lesson.topic || lesson._requestedTopic || '今天的课';
  LESSON.chapters = (lesson.chapters||[]).map(c=>c.title);
  LESSON.scenes = [];
  (lesson.chapters||[]).forEach((c,ci)=> (c.scenes||[]).forEach(s=>{
    LESSON.scenes.push({ ch:ci, narration:s.narration, visual:s.visual, highlight:s.highlight||[] });
  }));
}

/* ---------- 播放器 ---------- */
let cur=0, playing=true, timer=null;
const PLAY_MS=4600;
function renderRail(){
  const list=document.getElementById("railList"); list.innerHTML="";
  LESSON.chapters.forEach((c,i)=>{
    const d=document.createElement("div"); d.className="step"; d.dataset.ch=i;
    d.innerHTML=`<span class="ix">${i+1}</span><span>${esc(c)}</span>`;
    d.onclick=()=>jumpToChapter(i);
    list.appendChild(d);
  });
}
function renderScene(i){
  if(!LESSON.scenes.length) return;
  cur=Math.max(0,Math.min(i,LESSON.scenes.length-1));
  const s=LESSON.scenes[cur];
  setBoard(renderVisual(s.visual, s.highlight));
  document.getElementById("subtitle").textContent=s.narration||'';
  document.getElementById("chapterTag").textContent=LESSON.chapters[s.ch]||'';
  document.getElementById("sceneCounter").textContent=`${cur+1} / ${LESSON.scenes.length}`;
  document.getElementById("progressBar").style.width=((cur+1)/LESSON.scenes.length*100)+"%";
  document.querySelectorAll(".step").forEach(st=>{
    const ch=+st.dataset.ch; st.classList.toggle("active",ch===s.ch); st.classList.toggle("done",ch<s.ch);
  });
  const t=document.getElementById("tutor"); t.classList.add("speaking");
  document.getElementById("tutorBubble").textContent = bubbleFor(s.ch);
}
function bubbleFor(ch){return ["我们从一个直觉开始 👀","跟着我，一步步来 ✍️","这里是重点，记一下 ⭐","看演示，会更清楚 🔍","来检验一下 ✅","收个尾，记住核心 🎯"][ch % 6] || "在听 🙋";}
function nextScene(){ if(cur<LESSON.scenes.length-1){renderScene(cur+1);} else {pausePlay();} resetTimer(); }
function prevScene(){ renderScene(cur-1); resetTimer(); }
function jumpToChapter(ch){ const idx=LESSON.scenes.findIndex(s=>s.ch===ch); if(idx>=0){renderScene(idx); resetTimer();} }
function togglePlay(){ playing?pausePlay():startPlay(); }
function startPlay(){ playing=true; document.getElementById("playBtn").textContent="⏸"; resetTimer(); }
function pausePlay(){ playing=false; document.getElementById("playBtn").textContent="▶"; clearTimeout(timer); }
function resetTimer(){ clearTimeout(timer); if(playing){ timer=setTimeout(()=>{ if(cur<LESSON.scenes.length-1){nextScene();} else {pausePlay();} }, PLAY_MS); } }

/* ---------- 备课中 / 提示 ---------- */
function showLoading(on, topic){
  const l=document.getElementById("loading");
  if(on){ document.getElementById("loadingMain").textContent = topic?`正在为「${topic}」备课…`:'老师正在备课…';
    document.getElementById("boardPad").innerHTML=''; document.getElementById("chapterTag").textContent='';
    document.getElementById("sceneCounter").textContent=''; document.getElementById("subtitle").textContent='老师正在现场设计这堂课，请稍候…';
    document.getElementById("tutorBubble").textContent='我整理一下今天怎么讲… 🤔';
    l.classList.remove("hidden");
  } else l.classList.add("hidden");
}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 4200);
}

/* ---------- 入口：点题 → 生成 → 播放 ---------- */
function fillTopic(t){ document.getElementById("topicInput").value=t; document.getElementById("topicInput").focus(); }
async function fetchLesson(topic){
  const r = await fetch('/api/lesson', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({topic})});
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error || ('HTTP '+r.status)); }
  return r.json();
}
async function startLesson(){
  const topic=(document.getElementById('topicInput').value||'').trim() || 'Transformer 的注意力机制';
  document.getElementById('entry').style.display='none';
  document.getElementById('lesson').classList.add('on');
  document.getElementById('topTitle').innerHTML=`正在备课：<b>${esc(topic)}</b>`;
  pausePlay(); showLoading(true, topic);
  try{
    const lesson = await fetchLesson(topic);
    loadLesson(lesson);
    showLoading(false);
    const badge = lesson._mock ? ` <span class="mode-badge">示例模式</span>` : '';
    document.getElementById('topTitle').innerHTML=`正在上：<b>${esc(LESSON.title)}</b>${badge}`;
    if(lesson._mock) toast('当前为示例模式：内容是内置样例课。设置 ANTHROPIC_API_KEY 后即可生成任意主题。');
    renderRail(); renderScene(0); startPlay();
  }catch(e){
    loadLesson(BUILTIN_LESSON); showLoading(false);
    document.getElementById('topTitle').innerHTML=`正在上：<b>${esc(LESSON.title)}</b> <span class="mode-badge warn">离线示例</span>`;
    renderRail(); renderScene(0); startPlay();
    toast('未连接到后端，已加载内置示例课。启动后端可现场生成任意主题。');
  }
}
function resetApp(){
  pausePlay();
  document.getElementById("lesson").classList.remove("on");
  document.getElementById("entry").style.display="flex";
  document.getElementById("topTitle").textContent="";
}

/* ---------- 提问（实时则问后端，否则用内置回答）---------- */
const QA_FALLBACK={
  "除以":"因为 Q·K 的点积会随维度变大，数值一大 softmax 就会变得非常「尖」、梯度趋零、训练不稳。除以 √dₖ 把方差拉回 1 附近，让分布平滑。",
  "softmax":"softmax 把一组分数变成都为正、且和为 1 的权重，这样才能当「占比」去加权求和 V。",
  "default":"好问题！在实时模式下，我会结合你当前学到的这一步，给出针对性的解答，并可在板书上补一段演示。"
};
let LIVE_MODE=false;
function openAsk(){ pausePlay(); document.getElementById("askModal").classList.add("on"); document.getElementById("askInput").focus(); }
function closeAsk(){ document.getElementById("askModal").classList.remove("on"); startPlay(); }
async function answerAsk(){
  const q=(document.getElementById("askInput").value||'').trim() || '能再讲讲刚才那一步吗？';
  const out=document.getElementById("askAnswer");
  out.textContent='老师思考中…';
  const ctx = (LESSON.scenes[cur]&&LESSON.scenes[cur].narration)||'';
  try{
    if(!LIVE_MODE) throw new Error('not live');
    const r=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({topic:LESSON.title, question:q, context:ctx})});
    if(!r.ok) throw new Error('http');
    const j=await r.json(); out.textContent = j.answer || '（无回答）';
  }catch(e){
    let a=QA_FALLBACK.default; for(const k in QA_FALLBACK){ if(k!=='default' && q.includes(k)){ a=QA_FALLBACK[k]; break; } }
    out.textContent=a;
  }
}

/* 键盘控制 */
window.addEventListener("keydown",e=>{
  if(document.getElementById("lesson").classList.contains("on") && !document.getElementById("askModal").classList.contains("on")){
    if(e.key==="ArrowRight")nextScene();
    if(e.key==="ArrowLeft")prevScene();
    if(e.key===" "){e.preventDefault();togglePlay();}
  }
});

/* 启动：探测后端模式，初始化 mermaid */
(function init(){
  try{ if(window.mermaid) mermaid.initialize({startOnLoad:false, theme:'dark', securityLevel:'loose', fontFamily:'inherit'}); }catch(e){}
  fetch('/health').then(r=>r.json()).then(h=>{
    LIVE_MODE = h.mode==='live';
    const note=document.getElementById('entryNote');
    if(h.mode==='live') note.innerHTML=`✅ 已连接实时生成（模型 <code>${esc(h.model||'')}</code>）— 输入任意主题，老师现场为你开课。`;
    else note.innerHTML=`当前为<b style="color:var(--teal)">示例模式</b>：会返回内置样例课。要生成任意主题，请用 <code>ANTHROPIC_API_KEY=... node server/server.js</code> 启动后端。`;
  }).catch(()=>{
    document.getElementById('entryNote').innerHTML=`提示：直接打开本文件可看<b style="color:var(--teal)">内置示例课</b>；运行 <code>node server/server.js</code> 后端可现场生成任意主题。`;
  });
})();

/* =========================================================================
   BUILTIN_LESSON —— 离线/无后端时的内置示例课（Lesson Script 契约形态）
   ========================================================================= */
const BUILTIN_LESSON = {
  topic:"Transformer 的注意力机制", level:"入门", language:"zh-CN",
  chapters:[
    { id:"hook", title:"导入", scenes:[
      { narration:"先看这句话——读到「它」的时候，你怎么知道指的是猫，而不是垫子？",
        visual:{type:"text", content:"小猫跳上垫子，因为 **它** 很软。\n\n你瞬间就联系到了上下文里的相关词。**注意力机制做的就是这件事**：让模型为每个词，找到该「关注」哪些词。"},
        board_action:"fade_in", highlight:["它"] }
    ]},
    { id:"what", title:"是什么", scenes:[
      { narration:"一句话定义：注意力，就是为每个词，按相关度对其他词的信息做一次加权汇总。",
        visual:{type:"text", content:"## 注意力机制是什么\n- 为**每个词**，计算它与其他词的**相关度**\n- 按相关度当**权重**，把其他词的信息**加权汇总**\n- 于是每个词都带上了**该有的上下文**"}, board_action:"reveal_list" },
      { narration:"实现上靠三个角色：Query 查询、Key 钥匙、Value 内容。像在图书馆查资料：问题去比对书签，匹配上了就取书的内容。",
        visual:{type:"diagram", format:"mermaid", content:"graph LR; Q[问题 Query] -->|比对| K[书签 Key]; K -->|匹配高→多取| V[内容 Value]; V --> O[加权汇总]"}, board_action:"draw_step_by_step" }
    ]},
    { id:"why", title:"为什么", scenes:[
      { narration:"为什么需要它？老办法 RNN 一个词一个词顺着读，离得远的词信息会衰减，还没法并行。",
        visual:{type:"diagram", format:"mermaid", content:"graph LR; w1[w1]-->w2[w2]-->w3[w3]-->w4[w4]"}, board_action:"draw_step_by_step" },
      { narration:"注意力一步就让任意两个词直接相连，还能整句并行计算。这就是它的威力。",
        visual:{type:"text", content:"## 注意力赢在哪\n- **长距离直达**：任意两词一步相连\n- **可并行**：整句一起算，训练快\n- **全局视野**：每个词都看全句再决定关注谁"}, board_action:"reveal_list" }
    ]},
    { id:"how", title:"怎么做", scenes:[
      { narration:"上公式。别怕，我们一项一项拆。这就是「缩放点积注意力」。",
        visual:{type:"formula", latex:"\\text{Attention}(Q,K,V)=\\text{softmax}\\left(\\frac{QK^{T}}{\\sqrt{d_k}}\\right)V"}, board_action:"write_formula" },
      { narration:"第一步 QKᵀ 算相似度；第二步除以根号 dₖ 缩放；第三步 softmax 归一化成权重；第四步加权求和 V。四步走完，就这么简单。",
        visual:{type:"text", content:"## 四步拆解\n- **① QKᵀ**：算相似度，谁和谁相关\n- **② ÷√dₖ**：缩放，防止数值过大、梯度不稳\n- **③ softmax**：把分数变成和为 1 的权重\n- **④ ×V**：按权重加权求和"}, board_action:"reveal_list" }
    ]},
    { id:"demo", title:"演示", scenes:[
      { narration:"看段伪代码走一遍，其实就四行核心。",
        visual:{type:"code", language:"python", content:"# Q, K, V: 形状 [序列长度, d_k]\nscores  = Q @ K.T              # ① 点积算相似度\nscores  = scores / np.sqrt(d_k) # ② 缩放\nweights = softmax(scores, -1)   # ③ 归一化成权重\noutput  = weights @ V           # ④ 加权求和 V"}, board_action:"type_code" },
      { narration:"再看算出来的权重：每行是一个词的注意力分布，颜色越深关注越多。看「它」那行——它把注意力大量给了「小猫」。",
        visual:{type:"heatmap", rows:["小猫","垫子","它"], cols:["小猫","垫子","它"], weights:[[0.7,0.2,0.1],[0.2,0.7,0.1],[0.62,0.18,0.2]], annotate:"「它」→「小猫」= **0.62**，模型据此判断「它」≈「猫」。"}, board_action:"fade_in" }
    ]},
    { id:"check", title:"检验", scenes:[
      { narration:"随堂一题：除以根号 dₖ 的主要作用是什么？",
        visual:{type:"quiz", question:"公式里除以 √dₖ 的主要作用是？", options:["增加参数量","防止点积过大、让 softmax 梯度稳定","把权重变成概率","加快矩阵乘法"], answer:1, explain_correct:"维度高时点积偏大，softmax 会过尖、梯度趋零；缩放把方差拉回 1 附近。", explain_wrong:"问题出在「数值过大」会让 softmax 走极端。"}, board_action:"fade_in" }
    ]},
    { id:"summary", title:"小结", scenes:[
      { narration:"收一下。注意力就一句话：为每个词，按相关度加权汇总上下文。记住 Q/K/V 和这四步，你就抓住了 Transformer 的心脏。",
        visual:{type:"text", content:"## 一页记住注意力\n- **一句话**：为每个词，按相关度加权汇总上下文\n- **三角色**：Q 查询 · K 钥匙 · V 内容\n- **四步**：点积 → 缩放 → softmax → 加权求和\n- **再往下**：多头注意力 → Transformer → 大模型的地基"}, board_action:"reveal_list" }
    ]}
  ]
};
</script>
</body>
</html>
